<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Familie auf Pfoten – eine tierisch nette Familie: die gemeinsame Chronik eurer Tiere mit Familienbande, Erinnerungen und Pinnwand."
    />
    <meta name="theme-color" content="#fbf5ec" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Als App aufs Handy (ohne App Store): Manifest, Symbole und Startbildschirm-Angaben für iOS - der Service Worker
         (dist/sw.js) wird in src/main.jsx angemeldet, nur im Produktions-Build. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pfoten" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Startbilder für iOS (nur vom Home-Bildschirm, Hochformat): Pfote auf Papier, hell und dunkel - die drei häufigsten
         iPhone-Maße (public/splash, gezeichnet aus icons/icon-512.png). Android nimmt background_color und Symbol aus dem
         Manifest. Weitere Geräte zeigen einfach den Hintergrund, dann die App. -->
    <link rel="apple-touch-startup-image" href="/splash/splash-1170x2532.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-1170x2532-dark.png" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-1179x2556.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-1179x2556-dark.png" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-1290x2796.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" />
    <link rel="apple-touch-startup-image" href="/splash/splash-1290x2796-dark.png" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" />
    <script src="/darstellung-init.js"></script>
    <title>Familie auf Pfoten</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
