services:
  chronik:
    build: .
    # Zwei Instanzen auf einem Server (Familien-Instanz und Vorschau) brauchen eigene Namen,
    # sonst überschreibt die eine das Image bzw. den Container der anderen. Standard = Familien-Instanz.
    image: bernersennen-stammbaum:${IMAGE_TAG:-latest}
    container_name: ${CONTAINER_NAME:-bernersennen-stammbaum}
    restart: unless-stopped
    # Nur auf localhost erreichbar. HTTPS nach außen macht der gemeinsame Caddy des Servers
    # (Repo "server", /opt/proxy): er lauscht auf der öffentlichen IP unter demselben Port
    # und leitet https://SERVER-IP:HTTPS_PORT an 127.0.0.1:HTTPS_PORT weiter.
    ports:
      - "127.0.0.1:${HTTPS_PORT:-3010}:3000"
    env_file:
      - .env
    volumes:
      # SQLite-Datenbank und hochgeladene Fotos (Host-Ordner muss UID 1000 gehören)
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
